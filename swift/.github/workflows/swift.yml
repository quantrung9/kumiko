name: Swift CI

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'swift/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'swift/**'

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

    - name: Swift version
      run: swift --version

    - name: Build
      run: |
        cd swift
        swift build -v

    - name: Run tests
      run: |
        cd swift
        swift test -v

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
    - uses: actions/checkout@v4

    - name: Swift version
      run: swift --version

    - name: Build
      run: |
        cd swift
        swift build -v

    - name: Run tests
      run: |
        cd swift
        swift test -v

  lint:
    name: SwiftLint
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Lint
      run: |
        cd swift
        swiftlint lint --strict
      continue-on-error: true
